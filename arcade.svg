<text class="t" x="976" y="34" text-anchor="end" fill="#f472b6">HI 004200</text>
<g transform="translate(0,124)">
<g class="o"><use href="#sp"/><g transform="translate(6,-70)"><g class="c"><use href="#co"/></g></g></g>
