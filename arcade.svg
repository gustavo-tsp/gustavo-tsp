<g id="co"><path fill="#fbbf24" d="M5 0h15v5h-15zM0 5h10v5h-10zM15 5h10v5h-10zM0 10h5v5h-5zM20 10h5v5h-5zM0 15h10v5h-10zM15 15h10v5h-10zM5 20h15v5h-15z"/><path fill="#fde68a" d="M10 5h5v5h-5zM5 10h15v5h-15zM10 15h5v5h-5z"/></g>
</defs>
<style>
.t{font:700 17px 'Courier New',monospace;letter-spacing:2px}
.s{fill:#e2e8f0;animation:tw 3s ease-in-out infinite}
.hl{animation:a4 12s linear infinite}
.gr{animation:a8 .4444s linear infinite}
.o{animation:run 6s linear infinite}
.o2,.c2{animation-delay:-3s}
.j{animation:jp 6s linear infinite}
.c{animation:sp .9s linear infinite,vn 6s linear infinite;transform-box:fill-box;transform-origin:center}
.c2{animation-delay:0s,-3s}
.la{animation:fa .3s steps(1) infinite}
.lb{animation:fb .3s steps(1) infinite}
.bk{animation:fa 1.2s steps(1) infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes a4{to{transform:translateX(-400px)}}
@keyframes a8{to{transform:translateX(-80px)}}
@keyframes run{from{transform:translateX(1000px)}to{transform:translateX(-80px)}}
@keyframes jp{0%,20%{transform:translateY(0);animation-timing-function:ease-out}28%{transform:translateY(-84px);animation-timing-function:ease-in}36%,70%{transform:translateY(0);animation-timing-function:ease-out}78%{transform:translateY(-84px);animation-timing-function:ease-in}86%,100%{transform:translateY(0)}}
@keyframes sp{50%{transform:scaleX(.15)}}
@keyframes vn{0%,78%{opacity:1}79%,100%{opacity:0}}
@keyframes fa{0%{opacity:1}50%{opacity:0}}
@keyframes fb{0%{opacity:0}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.s,.hl,.gr,.o,.j,.c,.la,.lb,.bk{animation:none}.o{transform:translateX(600px)}}
</style>
